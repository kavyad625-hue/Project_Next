<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project NEXT · TrendScape India · Unilever HUL</title>
<style>
  /* ---------- Design tokens (India theme) ---------- */
  :root {
    --bg: #fdf9f1;                 /* warm ivory */
    --surface: #ffffff;
    --surface-2: #fbf6ea;
    --border: #ecdfc7;
    --border-strong: #d8c8a4;
    --text: #1f1810;
    --text-dim: #5a4b34;
    --text-mute: #8f7d5f;

    --brand: #FF6B1A;              /* deep saffron */
    --brand-2: #E55A00;
    --brand-soft: #fff2e5;

    --green: #0F8B3E;              /* India green */
    --green-soft: #e2f5e9;

    --navy: #14213D;               /* Ashoka navy */
    --gold: #E4A11B;               /* turmeric */
    --gold-soft: #fff2d1;
    --sindoor: #C1272D;            /* sindoor red */
    --sindoor-soft: #fbe4e5;

    --ok: var(--green);
    --ok-soft: var(--green-soft);
    --warn: var(--gold);
    --warn-soft: var(--gold-soft);
    --risk: var(--sindoor);
    --risk-soft: var(--sindoor-soft);

    /* signal-type colours (India festival palette) */
    --c-weather:  #FF6A3D;
    --c-sports:   #0F8B3E;
    --c-festival: #C1272D;
    --c-prices:   #E4A11B;
    --c-news:     #6b7280;
    --c-social:   #7c3aed;
    --c-monsoon:  #0284c7;
    --c-aqi:      #4b3a1e;

    --shadow-sm: 0 1px 2px rgba(31,24,16,.05), 0 1px 3px rgba(31,24,16,.04);
    --shadow-md: 0 4px 14px rgba(31,24,16,.08), 0 2px 6px rgba(31,24,16,.05);
    --radius: 12px;
    --radius-lg: 16px;
    --sidebar-w: 244px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle rangoli-inspired background pattern */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,107,26,.04) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(15,139,62,.04) 0, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(228,161,27,.03) 0, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  a { color: inherit; text-decoration: none; }
  input, select, textarea { font-family: inherit; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }
  .sidebar {
    width: var(--sidebar-w);
    background: linear-gradient(180deg, #14213D 0%, #0d1729 100%);
    color: #d8dbe8;
    padding: 20px 14px;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
  }
  /* Ashoka chakra motif on sidebar */
  .sidebar::before {
    content: ''; position: absolute; right: -60px; bottom: 20px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,26,.10) 0%, transparent 70%);
    pointer-events: none;
  }

  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 8px 18px; margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
  }
  .brand-mark {
    width: 40px; height: 40px; border-radius: 50%;
    background: white;
    display: grid; place-items: center;
    position: relative; flex-shrink: 0;
    box-shadow: 0 0 0 2px rgba(255,255,255,.15);
  }
  .brand-mark svg { width: 30px; height: 30px; }
  .brand-text { color: white; font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
  .brand-sub { color: #FF9933; font-size: 11px; margin-top: 1px; font-weight: 600; letter-spacing: 0.4px; }

  .nav-group-label {
    text-transform: uppercase; font-size: 10px; letter-spacing: 1px;
    color: #FF9933; padding: 12px 10px 4px; font-weight: 700;
    opacity: .85;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px; color: #c9ceda;
    font-size: 13px; cursor: pointer; transition: background .15s, color .15s;
    width: 100%; text-align: left;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: white; }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(255,107,26,.20), rgba(255,107,26,.05));
    color: white;
    box-shadow: inset 3px 0 0 var(--brand);
  }
  .nav-item.active .nav-icon { color: var(--brand); }
  .nav-icon { width: 18px; height: 18px; display: grid; place-items: center; }
  .nav-pill {
    margin-left: auto; background: var(--sindoor); color: white;
    font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600;
  }
  .nav-pill.warn { background: var(--gold); color: #4a3400; }
  .nav-pill.brand { background: var(--brand); }
  .nav-pill.ok    { background: var(--green); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- Topbar with tricolor stripe ---------- */
  .tricolor {
    height: 4px;
    background: linear-gradient(90deg,
      #FF9933 0%, #FF9933 33.3%,
      #ffffff 33.3%, #ffffff 66.6%,
      #138808 66.6%, #138808 100%);
    position: sticky; top: 0; z-index: 21;
  }
  .tricolor::after {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 20px; height: 20px; border-radius: 50%;
    background: white;
    border: 1px solid #000080;
    margin-top: -8px;
    background-image: radial-gradient(circle, #000080 2px, transparent 2px),
      conic-gradient(from 0deg, transparent 0deg, transparent 15deg, #000080 15deg, #000080 16deg,
        transparent 16deg, transparent 30deg, #000080 30deg, #000080 31deg);
    background-size: 100% 100%;
    display: none; /* subtle · hide chakra badge for cleanliness */
  }
  .topbar {
    height: 60px; background: white;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 24px; gap: 14px;
    position: sticky; top: 4px; z-index: 20;
  }
  .top-title { font-weight: 700; font-size: 15px; color: var(--navy); }
  .top-crumb { color: var(--text-mute); font-size: 12px; margin-top: 1px; }
  .top-search {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    background: var(--bg); border-radius: 8px;
    padding: 8px 12px; width: 260px; max-width: 30vw;
    border: 1px solid transparent;
  }
  .top-search:focus-within { border-color: var(--brand); background: white; }
  .top-search { position: relative; }
  .top-search input {
    border: none; background: transparent; outline: none; width: 100%;
    font-size: 13px; color: var(--text);
  }
  .top-actions { display: flex; align-items: center; gap: 10px; }

  /* ---------- Search results dropdown ---------- */
  .search-results {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0;
    background: white; border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow-md);
    max-height: 360px; overflow-y: auto; z-index: 30;
    display: none;
  }
  .search-results.open { display: block; }
  .search-result-group { padding: 8px 0; }
  .search-result-group + .search-result-group { border-top: 1px solid var(--border); }
  .search-result-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-mute); font-weight: 700; padding: 4px 14px;
  }
  .search-result-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; cursor: pointer;
  }
  .search-result-item:hover { background: var(--surface-2); }
  .search-result-title { font-size: 12.5px; font-weight: 700; color: var(--navy); }
  .search-result-meta { font-size: 11px; color: var(--text-mute); }
  .search-empty { padding: 16px; text-align: center; color: var(--text-mute); font-size: 12.5px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    display: grid; place-items: center; color: var(--text-dim);
    position: relative; background: var(--bg);
  }
  .icon-btn:hover { background: var(--brand-soft); color: var(--brand); }
  .icon-btn .dot {
    position: absolute; top: 7px; right: 7px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--sindoor);
    border: 2px solid white;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--brand), var(--gold));
    color: white; display: grid; place-items: center;
    font-weight: 700; font-size: 12px;
    box-shadow: 0 0 0 2px rgba(255,107,26,.15);
  }

  /* ---------- Content ---------- */
  .content { padding: 24px; flex: 1; min-width: 0; }
  .page-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .page-title {
    font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin: 0;
    color: var(--navy);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .page-sub { color: var(--text-dim); margin: 4px 0 0; font-size: 13px; max-width: 720px; }
  .badge-live {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-soft); color: var(--green);
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px;
  }
  .badge-live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(15,139,62,.5); }
    70% { box-shadow: 0 0 0 6px rgba(15,139,62,0); }
    100% { box-shadow: 0 0 0 0 rgba(15,139,62,0); }
  }
  .badge-india {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    background: linear-gradient(90deg,#fff2e5,#e2f5e9);
    color: var(--navy);
    border: 1px solid var(--border);
  }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: white; color: var(--text); border: 1px solid var(--border-strong);
    transition: all .15s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary {
    background: var(--brand); color: white; border-color: var(--brand);
  }
  .btn-primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
  .btn-ok { background: var(--green); color: white; border-color: var(--green); }
  .btn-ok:hover { filter: brightness(0.95); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
  .btn-ghost:hover { background: var(--bg); color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ---------- Cards ---------- */
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow-sm);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 14px; font-weight: 700; margin: 0;
    display: flex; align-items: center; gap: 8px;
    color: var(--navy);
  }
  .card-sub { font-size: 12px; color: var(--text-mute); margin: 2px 0 0; }
  .card-tools { display: flex; align-items: center; gap: 6px; }

  /* ---------- Grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-12-8 { grid-template-columns: 1fr 2fr; }
  .g-8-4 { grid-template-columns: 2fr 1fr; }
  .g-fill-3 { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

  /* ---------- KPI ---------- */
  .kpi {
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .kpi::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #FF9933 0%, #FF9933 33%, white 33%, white 66%, #138808 66%);
    opacity: .35;
  }
  .kpi-label {
    text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px;
    color: var(--text-mute); font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--navy); }
  .kpi-delta {
    font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--sindoor); }
  .kpi-spark { margin-top: 6px; height: 30px; width: 100%; }

  /* ---------- Chips / tags ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 12px;
    font-size: 11px; font-weight: 700;
    background: var(--bg); color: var(--text-dim);
  }
  .chip.brand { background: var(--brand-soft); color: var(--brand-2); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: #7a4d00; }
  .chip.risk { background: var(--risk-soft); color: var(--risk); }
  .chip.navy { background: rgba(20,33,61,.08); color: var(--navy); }
  .chip .dot {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  /* ---------- Table ---------- */
  .table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table th, .table td {
    text-align: left; padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .table th {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-mute); font-weight: 700; background: var(--surface-2);
  }
  .table tbody tr:hover { background: var(--surface-2); cursor: pointer; }
  .table tbody tr:last-child td { border-bottom: none; }

  /* ---------- Sub-nav tabs ---------- */
  .tabs {
    display: flex; gap: 4px; background: white; border: 1px solid var(--border);
    padding: 5px; border-radius: 12px; margin-bottom: 18px;
    overflow-x: auto;
  }
  .tab {
    padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    color: var(--text-dim); white-space: nowrap; display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { background: var(--brand); color: white; }
  .tab .num {
    background: rgba(255,255,255,.28); color: inherit;
    font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 700;
  }
  .tab:not(.active) .num { background: var(--bg); color: var(--text-mute); }

  /* ---------- India Map ---------- */
  .map-wrap {
    background: linear-gradient(180deg, #14213D 0%, #0a132a 100%);
    border-radius: var(--radius);
    height: 460px;
    position: relative;
    overflow: hidden;
  }
  .map-svg { width: 100%; height: 100%; display: block; }
  .map-legend {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(10,15,35,.88); backdrop-filter: blur(4px);
    padding: 10px 12px; border-radius: 10px;
    display: flex; gap: 14px; flex-wrap: wrap;
    color: white; font-size: 11px;
    border: 1px solid rgba(255,255,255,.08);
    max-width: 60%;
  }
  .map-legend-item { display: flex; align-items: center; gap: 6px; }
  .map-legend-item .dot {
    width: 9px; height: 9px; border-radius: 50%;
    box-shadow: 0 0 8px currentColor;
  }
  .map-filters {
    position: absolute; top: 12px; right: 12px;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    max-width: 70%;
  }
  .map-filter {
    padding: 5px 10px; border-radius: 12px; font-size: 11px; font-weight: 700;
    background: rgba(255,255,255,.10); color: white; cursor: pointer;
    border: 1px solid rgba(255,255,255,.15);
    display: flex; align-items: center; gap: 6px;
  }
  .map-filter.off { opacity: .38; }
  .map-filter .dot { width: 7px; height: 7px; border-radius: 50%; }
  .map-dot { cursor: pointer; transition: r .2s; }
  .map-dot:hover { r: 1.6; }
  .map-ping {
    animation: mapPing 2.4s ease-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes mapPing {
    0% { r: 0.6; opacity: .8; }
    100% { r: 4; opacity: 0; }
  }
  .map-callout {
    position: absolute;
    background: white;
    padding: 12px 14px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.24);
    font-size: 12px; max-width: 260px;
    pointer-events: none; z-index: 5;
  }
  .map-callout .cb-title { font-weight: 700; font-size: 13px; margin-bottom: 3px; color: var(--navy); }
  .map-callout .cb-meta { color: var(--text-mute); font-size: 11px; margin-bottom: 6px; }
  .map-city-label {
    fill: rgba(255,255,255,.55); font-size: 1.2px; font-weight: 600;
    pointer-events: none;
  }
  .map-city-dot { fill: rgba(255,255,255,.35); }
  .map-title-overlay {
    position: absolute; top: 12px; left: 12px;
    color: white;
    background: rgba(20,33,61,.55); backdrop-filter: blur(4px);
    padding: 6px 12px; border-radius: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,.08);
  }

  /* ---------- Signal Explorer (interactive, replaces the old map) ---------- */
  .sig-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .sig-filter {
    padding: 6px 12px; border-radius: 12px; font-size: 11.5px; font-weight: 700;
    background: var(--bg); color: var(--text-dim); cursor: pointer;
    border: 1px solid var(--border-strong);
    display: flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .sig-filter .dot { width: 7px; height: 7px; border-radius: 50%; }
  .sig-filter.off { opacity: .4; }
  .sig-filter:not(.off):hover { transform: translateY(-1px); }
  .sig-bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .sig-bar-row { display: grid; grid-template-columns: 76px 1fr 34px; align-items: center; gap: 10px; font-size: 12px; }
  .sig-bar-track { height: 10px; background: var(--bg); border-radius: 6px; overflow: hidden; position: relative; }
  .sig-bar-fill { height: 100%; border-radius: 6px; transition: width .3s ease; cursor: pointer; }
  .sig-bar-fill:hover { filter: brightness(1.1); }
  .sig-list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .sig-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; background: var(--surface-2);
    border-radius: 10px; cursor: pointer; transition: background .15s;
  }
  .sig-item:hover { background: var(--brand-soft); }
  .sig-icon {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    display: grid; place-items: center; color: white;
  }
  .sig-empty { padding: 24px; text-align: center; color: var(--text-mute); font-size: 13px; }

  /* ---------- Interactive line / metric charts ---------- */
  .trend-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .trend-toggle {
    padding: 6px 12px; border-radius: 12px; font-size: 11.5px; font-weight: 700;
    background: var(--bg); color: var(--text-dim); cursor: pointer;
    border: 1px solid var(--border-strong);
    display: flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .trend-toggle .dot { width: 8px; height: 8px; border-radius: 50%; }
  .trend-toggle.off { opacity: .35; }
  .trend-chart-wrap { position: relative; }
  .trend-tooltip {
    position: absolute; pointer-events: none;
    background: var(--navy); color: white;
    padding: 8px 10px; border-radius: 8px; font-size: 11.5px;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
    transform: translate(-50%, -110%);
    white-space: nowrap; z-index: 5; opacity: 0; transition: opacity .1s;
  }
  .trend-tooltip.show { opacity: 1; }
  .trend-dot { cursor: pointer; }
  .metric-toggle-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .metric-bars { display: flex; align-items: flex-end; gap: 14px; height: 220px; padding: 6px 4px 0; }
  .metric-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
  .metric-bar { width: 100%; max-width: 46px; border-radius: 8px 8px 3px 3px; position: relative; cursor: pointer; transition: filter .15s; }
  .metric-bar:hover { filter: brightness(1.1); }
  .metric-bar-value { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 800; color: var(--navy); white-space: nowrap; }
  .metric-bar-label { font-size: 10.5px; color: var(--text-mute); text-align: center; line-height: 1.3; max-width: 70px; }

  /* ---------- Creative Twin video widget ---------- */
  .video-wrap {
    background: linear-gradient(180deg, #14213D 0%, #0a132a 100%);
    border-radius: var(--radius); overflow: hidden; position: relative;
  }
  .video-canvas { width: 100%; height: 320px; display: block; cursor: pointer; }
  .video-controls {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: rgba(10,15,35,.9);
  }
  .video-play-btn {
    width: 32px; height: 32px; border-radius: 50%; background: var(--brand);
    display: grid; place-items: center; color: white; flex-shrink: 0;
  }
  .video-scrub {
    flex: 1; -webkit-appearance: none; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.25); outline: none; cursor: pointer;
  }
  .video-scrub::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--brand); cursor: pointer; box-shadow: 0 0 0 3px rgba(255,107,26,.25);
  }
  .video-time { color: rgba(255,255,255,.75); font-size: 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .video-badge {
    position: absolute; top: 12px; left: 12px;
    background: rgba(20,33,61,.6); backdrop-filter: blur(4px);
    color: white; font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 6px 12px; border-radius: 10px; text-transform: uppercase;
    border: 1px solid rgba(255,255,255,.08);
  }
  .video-rendering {
    position: absolute; top: 12px; right: 12px;
    background: var(--green-soft); color: var(--green);
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 10px;
    display: flex; align-items: center; gap: 6px;
  }

  /* ---------- Insight row ---------- */
  .insight-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--surface-2);
    border-radius: 10px; margin-bottom: 8px;
  }
  .insight-row:last-child { margin-bottom: 0; }
  .insight-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; color: white; flex-shrink: 0;
    font-size: 14px;
  }
  .insight-body { flex: 1; min-width: 0; }
  .insight-title { font-weight: 700; font-size: 13px; margin: 0 0 2px; }
  .insight-meta { font-size: 11.5px; color: var(--text-mute); }
  .insight-value { font-weight: 800; color: var(--brand); font-size: 13px; text-align: right; white-space: nowrap; }

  /* ---------- Fused card ---------- */
  .fused-card {
    background: linear-gradient(135deg, #fff2e5 0%, #e2f5e9 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    position: relative; overflow: hidden;
  }
  .fused-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, #FF9933 0%, #FF9933 33%, white 33%, white 66%, #138808 66%);
  }
  .fused-conf {
    background: white; border-radius: var(--radius); padding: 14px 16px;
    display: flex; align-items: center; gap: 14px; margin: 14px 0;
    border: 1px solid var(--border);
  }
  .conf-ring {
    width: 68px; height: 68px; position: relative; flex-shrink: 0;
  }
  .conf-ring svg { transform: rotate(-90deg); }
  .conf-ring .conf-num {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 16px; font-weight: 800; color: var(--brand-2);
  }
  .fused-formula {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .formula-token {
    padding: 4px 10px; background: white; border-radius: 8px;
    font-size: 11.5px; font-weight: 700; color: var(--brand-2);
    border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .formula-op { color: var(--text-dim); font-weight: 700; }

  /* ---------- Approval action bar ---------- */
  .action-bar {
    display: flex; gap: 10px; padding-top: 14px; border-top: 1px dashed var(--border-strong);
    align-items: center; flex-wrap: wrap;
  }

  /* ---------- Timeline / Roadmap ---------- */
  .timeline {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
  }
  .tl-item {
    background: white; border-radius: 12px; border: 1px solid var(--border);
    padding: 16px; position: relative;
  }
  .tl-phase { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-mute); font-weight: 700; }
  .tl-cost { font-size: 22px; font-weight: 800; margin: 4px 0; color: var(--brand-2); }
  .tl-note { font-size: 12px; color: var(--text-dim); }

  /* ---------- Approval queue rows ---------- */
  .queue-row {
    display: flex; padding: 16px 18px; gap: 16px;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .queue-row:last-child { border-bottom: none; }
  .queue-priority {
    width: 3px; height: 44px; border-radius: 3px; flex-shrink: 0;
  }
  .queue-body { flex: 1; min-width: 0; }
  .queue-title { font-weight: 700; font-size: 14px; margin: 0 0 3px; }
  .queue-meta {
    font-size: 12px; color: var(--text-mute);
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  .queue-scores { display: flex; gap: 20px; flex-shrink: 0; }
  .score-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .score-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
  .score-value { font-size: 15px; font-weight: 800; }

  /* ---------- Portfolio grid ---------- */
  .prod-card {
    background: white; border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s;
    cursor: pointer;
  }
  .prod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .prod-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .prod-icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: grid; place-items: center; color: white;
  }
  .prod-stage { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-mute); font-weight: 700; }
  .prod-name { font-size: 15px; font-weight: 800; margin: 4px 0 2px; color: var(--navy); }
  .prod-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.55; }
  .prod-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-mute); font-weight: 600;
  }

  /* ---------- Notification panel ---------- */
  .notif-panel {
    position: fixed; top: 64px; right: 12px; width: 380px; max-width: 92vw;
    background: white; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(31,24,16,.18);
    z-index: 50; overflow: hidden; display: none;
  }
  .notif-panel.open { display: block; }
  .notif-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .notif-list { max-height: 400px; overflow-y: auto; }
  .notif-item {
    padding: 12px 16px; display: flex; gap: 10px;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .notif-item:hover { background: var(--surface-2); }
  .notif-item.unread { background: #fff8ec; }
  .notif-item.unread .notif-title { font-weight: 700; }
  .notif-icon {
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    color: white; flex-shrink: 0;
  }
  .notif-title { font-size: 13px; margin: 0 0 2px; color: var(--navy); }
  .notif-desc { font-size: 12px; color: var(--text-mute); line-height: 1.4; }
  .notif-time { font-size: 11px; color: var(--text-mute); margin-top: 3px; }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(20,33,61,.55); backdrop-filter: blur(4px);
    z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: white; border-radius: 16px; width: 100%; max-width: 720px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    border-top: 4px solid var(--brand);
  }
  .modal-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 20px 22px 12px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 17px; font-weight: 800; margin: 0; color: var(--navy); }
  .modal-body { padding: 20px 22px; }
  .modal-foot {
    padding: 14px 22px; border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px;
  }

  /* ---------- Form ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .field input, .field select, .field textarea {
    padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
    font-size: 13px; background: white; color: var(--text); outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,107,26,.14);
  }

  /* ---------- Chart bars ---------- */
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 12px; }
  .bar {
    flex: 1; background: linear-gradient(180deg, var(--brand), var(--brand-2));
    border-radius: 4px 4px 0 0; position: relative;
    transition: opacity .15s;
  }
  .bar:hover { opacity: .85; }
  .bar-label {
    position: absolute; bottom: -20px; left: 0; right: 0;
    text-align: center; font-size: 10px; color: var(--text-mute); font-weight: 600;
  }
  .bar-value {
    position: absolute; top: -18px; left: 0; right: 0;
    text-align: center; font-size: 10px; font-weight: 700; color: var(--text-dim);
  }

  /* ---------- Creative Studio ---------- */
  .variant-card {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    background: white;
  }
  .variant-preview {
    aspect-ratio: 16/10;
    display: grid; place-items: center;
    color: white; font-weight: 800;
    text-align: center; padding: 20px; font-size: 15px;
    position: relative;
  }
  .variant-info { padding: 12px 14px; }
  .variant-title { font-size: 13px; font-weight: 700; margin: 0 0 3px; }
  .variant-meta { font-size: 11px; color: var(--text-mute); }
  .variant-actions {
    display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--border);
  }

  /* ---------- Signal loop ---------- */
  .loop-diagram {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
    align-items: stretch;
  }
  .loop-node {
    background: white; border: 2px solid var(--border);
    border-radius: 12px; padding: 14px; text-align: center;
    position: relative; font-size: 12px;
  }
  .loop-node.active { border-color: var(--brand); background: var(--brand-soft); }
  .loop-node-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--brand); color: white; font-weight: 800; font-size: 11px;
    display: grid; place-items: center; margin: 0 auto 6px;
  }

  /* ---------- Festival calendar strip ---------- */
  .fest-strip {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
  }
  .fest-card {
    flex: 0 0 200px;
    border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; background: white;
    display: flex; flex-direction: column; gap: 6px;
    position: relative; overflow: hidden;
  }
  .fest-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--brand);
  }
  .fest-name { font-weight: 800; font-size: 13px; color: var(--navy); }
  .fest-date { font-size: 11px; color: var(--text-mute); font-weight: 600; }
  .fest-cats { font-size: 11px; color: var(--text-dim); }

  /* ---------- Utils ---------- */
  .hidden { display: none !important; }
  .flex { display: flex; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .flex-gap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mb-md { margin-bottom: 16px; }
  .mt-md { margin-top: 16px; }
  .text-sm { font-size: 12px; color: var(--text-dim); }
  .text-mute { color: var(--text-mute); }
  .divider { height: 1px; background: var(--border); margin: 14px 0; }
  .mobile-toggle { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1200px) {
    .g-4 { grid-template-columns: repeat(2, 1fr); }
    .timeline { grid-template-columns: repeat(2, 1fr); }
    .g-12-8, .g-8-4 { grid-template-columns: 1fr; }
    .loop-diagram { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 900px) {
    .g-3 { grid-template-columns: 1fr; }
    .g-2 { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; left: 0; top: 0; z-index: 200;
      transform: translateX(-100%);
      transition: transform .25s;
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: grid; }
    .top-search { display: none; }
    .queue-scores { gap: 10px; }
    .score-value { font-size: 13px; }
  }
  @media (max-width: 600px) {
    .g-4 { grid-template-columns: 1fr; }
    .timeline { grid-template-columns: 1fr; }
    .content { padding: 16px; }
    .page-title { font-size: 18px; }
    .queue-row { flex-wrap: wrap; }
    .queue-scores { width: 100%; justify-content: space-around; }
  }

  /* SVG icons */
  .i { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .i-sm { width: 14px; height: 14px; stroke-width: 2; }
  .i-lg { width: 22px; height: 22px; stroke-width: 1.8; }
</style>

function icon(id, cls='i') { return `<svg class="${cls}"><use href="#${id}"/></svg>`; }
function fmtDelta(v) {
  const sign = v > 0 ? '+' : '';
  const cls = v >= 0 ? 'up' : 'down';
  const ic = v >= 0 ? 'i-arrow-up' : 'i-arrow-down';
  return `<span class="kpi-delta ${cls}">${icon(ic,'i-sm')} ${sign}${v}%</span>`;
}
function signalMeta(k) { return SIGNAL_TYPES.find(s => s.key === k); }
function riskChipClass(r) { return r === 'Low' ? 'ok' : r === 'Med' ? 'warn' : 'risk'; }
function roiChipClass(r)  { return r === 'High' ? 'ok' : r === 'Med' ? 'brand' : ''; }
function priorityColor(p) { return p === 'high' ? 'var(--sindoor)' : p === 'med' ? 'var(--gold)' : 'var(--green)'; }

function sparkline(values, color='#FF6B1A') {
  const w = 100, h = 28, max = Math.max(...values), min = Math.min(...values), range = max - min || 1;
  const pts = values.map((v,i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="kpi-spark">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity="0.12"/>
  </svg>`;
}
function confRing(pct, color='#FF6B1A') {
  const r = 26, c = 2 * Math.PI * r, off = c * (1 - pct/100);
  return `<div class="conf-ring">
    <svg width="68" height="68">
      <circle cx="34" cy="34" r="${r}" stroke="#ecdfc7" stroke-width="8" fill="none"/>
      <circle cx="34" cy="34" r="${r}" stroke="${color}" stroke-width="8" fill="none"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg>
    <div class="conf-num">${pct}%</div>
  </div>`;
}
function inr(n) {
  if (n >= 10000000) return `₹${(n/10000000).toFixed(1)} Cr`;
  if (n >= 100000)   return `₹${(n/100000).toFixed(1)} L`;
  return `₹${n.toLocaleString('en-IN')}`;
}

/* =====================================================
   FORECAST LAB · a genuinely-trained regression model,
   fit in the browser on the DERIVED trend data. No hardcoded
   outputs: change the training data and the model refits.
   ===================================================== */

// Solve an n×n linear system via Gaussian elimination with partial pivoting.
function solveLinearSystem(A, b) {
  const n = A.length;
  const M = A.map((row, i) => [...row, b[i]]);
  for (let i = 0; i < n; i++) {
    let maxRow = i;
    for (let k = i + 1; k < n; k++) if (Math.abs(M[k][i]) > Math.abs(M[maxRow][i])) maxRow = k;
    [M[i], M[maxRow]] = [M[maxRow], M[i]];
    const pivot = M[i][i] || 1e-9;
    for (let j = i; j <= n; j++) M[i][j] /= pivot;
    for (let k = 0; k < n; k++) {
      if (k === i) continue;
      const factor = M[k][i];
      for (let j = i; j <= n; j++) M[k][j] -= factor * M[i][j];
    }
  }
  return M.map(row => row[n]);
}

// Ordinary least squares, multiple features + bias, via the normal equations.
function fitLinearRegression(X, y) {
  const n = X.length, p = X[0].length; // p includes bias column
  const XtX = Array.from({length:p}, () => Array(p).fill(0));
  const Xty = Array(p).fill(0);
  for (let i = 0; i < n; i++) {
    for (let a = 0; a < p; a++) {
      Xty[a] += X[i][a] * y[i];
      for (let b = 0; b < p; b++) XtX[a][b] += X[i][a] * X[i][b];
    }
  }
  const beta = solveLinearSystem(XtX, Xty);
  const preds = X.map(row => row.reduce((s,v,i)=>s+v*beta[i], 0));
  const yMean = y.reduce((a,b)=>a+b,0) / n;
  const ssTot = y.reduce((s,v)=>s+(v-yMean)**2, 0);
  const ssRes = y.reduce((s,v,i)=>s+(v-preds[i])**2, 0);
  const r2 = ssTot > 0 ? 1 - ssRes/ssTot : 1;
  const mae = preds.reduce((s,v,i)=>s+Math.abs(v-y[i]), 0) / n;
  return { beta, preds, r2, mae, n };
}

// Simple least-squares trend line for a single series (used to extrapolate short series).
function fitTrendLine(values) {
  const n = values.length;
  const xMean = (n-1)/2;
  const yMean = values.reduce((a,b)=>a+b,0)/n;
  let num = 0, den = 0;
  values.forEach((v,i)=>{ num += (i-xMean)*(v-yMean); den += (i-xMean)**2; });
  const slope = den ? num/den : 0;
  const intercept = yMean - slope*xMean;
  return { slope, intercept };
}

function parseLeadDays(lead) {
  const m = /(\d+)/.exec(lead || '');
  return m ? parseInt(m[1], 10) : 3;
}

// Train once at load, on the live DERIVED dataset — features: confidence %, lead time (days) → target: predicted % change.
function trainForecastModel() {
  const rows = DERIVED.map(t => ({ conf: t.conf, lead: parseLeadDays(t.lead), y: t.change, label: t.trend, city: t.city }));
  const X = rows.map(r => [1, r.conf, r.lead]);
  const y = rows.map(r => r.y);
  const fit = fitLinearRegression(X, y);
  return { ...fit, rows };
}
const FORECAST_MODEL = trainForecastModel();
function predictLift(conf, leadDays) {
  const [b0, b1, b2] = FORECAST_MODEL.beta;
  return b0 + b1*conf + b2*leadDays;
}
// Connects the trained model to the Opportunity Scorer: reuse a matching DERIVED
// trend's real confidence when we have one for the same city, else fall back to
// brand-fit as a stand-in confidence input so every opportunity still gets a score.
function estimateOpportunityLift(o) {
  const leadDays = parseLeadDays(o.lead);
  const match = DERIVED.find(t => t.city === o.city);
  const conf = match ? match.conf : o.brandFit;
  return { lift: predictLift(conf, leadDays), confUsed: conf, matched: !!match };
}

function renderMap(container, opts={}) {
  const activeFilters = opts.filters || SIGNAL_TYPES.map(s=>s.key);

  // Simplified India silhouette path (approximate landmass shape inside 0-100 viewBox)

/* ---------- INTERACTIVE CATEGORY TREND LINE CHART ---------- */
let trendActiveKeys = CATEGORY_TRENDS.map(c => c.key);
// Generic hover-tooltip wiring for the simple CSS bar charts (Dashboard 2's
// "Predicted category Δ" and "Confidence distribution" bars, etc.). Pass the
// chart container id, the tooltip element id, and a fn(trend) => HTML string.
function wireBarTooltips(chartId, tooltipId, fmt) {
  const chart = document.getElementById(chartId);
  const tooltip = document.getElementById(tooltipId);
  if (!chart || !tooltip) return;
  chart.querySelectorAll('.bar').forEach(bar => {
    bar.style.cursor = 'pointer';
    bar.addEventListener('mouseenter', () => {
      const t = DERIVED[parseInt(bar.dataset.idx, 10)];
      if (!t) return;
      const chartRect = chart.getBoundingClientRect();
      const barRect = bar.getBoundingClientRect();
      const x = barRect.left - chartRect.left + barRect.width / 2;
      const y = barRect.top - chartRect.top;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.innerHTML = fmt(t);
      tooltip.classList.add('show');
    });
    bar.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });
}

function renderCategoryTrend(container) {
  const w = 760, h = 220, padL = 34, padB = 24, padT = 14, padR = 10;
  const days = ['6d ago','5d ago','4d ago','3d ago','2d ago','Yesterday','Today','+1d','+2d','+3d'];
  const totalSpan = days.length - 1; // 9
  const active = CATEGORY_TRENDS.filter(c => trendActiveKeys.includes(c.key));

  // Forecast the next 3 days per category using the model's trend-line fit (real least squares, not guesses).
  const forecasted = active.map(c => {
    const { slope, intercept } = fitTrendLine(c.values);
    const future = [7,8,9].map(i => Math.max(0, intercept + slope*i));
    return { ...c, future };
  });

  const allVals = forecasted.length ? forecasted.flatMap(c => [...c.values, ...c.future]) : [0];
  const maxV = Math.max(...allVals, 5);

  const xFor = i => padL + (i / totalSpan) * (w - padL - padR);
  const yFor = v => padT + (1 - v / maxV) * (h - padT - padB);

  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + f * (h - padT - padB);
    const val = Math.round(maxV * (1 - f));
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#ecdfc7" stroke-width="1"/>
            <text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="#8f7d5f">${val}%</text>`;
  }).join('');

  const todayX = xFor(6);
  const forecastZone = `<rect x="${todayX}" y="${padT}" width="${w-padR-todayX}" height="${h-padT-padB}" fill="#FF6B1A" opacity="0.04"/>
    <line x1="${todayX}" y1="${padT}" x2="${todayX}" y2="${h-padB}" stroke="#d8c8a4" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="${todayX+4}" y="${padT+9}" font-size="8.5" fill="#8f7d5f" font-weight="700">MODEL FORECAST →</text>`;

  const xLabels = days.map((d,i) => `<text x="${xFor(i)}" y="${h-6}" text-anchor="middle" font-size="9" fill="${i>6?'var(--brand-2)':'#8f7d5f'}" font-weight="${i>6?'700':'400'}">${d}</text>`).join('');

  const series = forecasted.map(c => {
    const pts = c.values.map((v,i) => `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    const dots = c.values.map((v,i) => `<circle class="trend-dot" cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.2" fill="${c.color}" data-cat="${c.label}" data-val="${v}" data-day="${days[i]}" data-kind="Actual"/>`).join('');

    const futurePts = [c.values[6], ...c.future].map((v,i) => `${xFor(6+i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    const futureDots = c.future.map((v,i) => `<circle class="trend-dot" cx="${xFor(7+i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.2" fill="white" stroke="${c.color}" stroke-width="2" data-cat="${c.label}" data-val="${v.toFixed(1)}" data-day="${days[7+i]}" data-kind="Model forecast"/>`).join('');

    return `<polyline points="${pts}" fill="none" stroke="${c.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}
      <polyline points="${futurePts}" fill="none" stroke="${c.color}" stroke-width="2.2" stroke-dasharray="4 3" stroke-linecap="round"/>${futureDots}`;
  }).join('');

  container.innerHTML = `
    <div class="trend-legend">
      ${CATEGORY_TRENDS.map(c => `
        <button class="trend-toggle ${trendActiveKeys.includes(c.key)?'':'off'}" data-key="${c.key}">
          <span class="dot" style="background:${c.color}"></span>${c.label}
        </button>
      `).join('')}
    </div>
    <p class="text-sm text-mute" style="margin:0 0 10px">Solid line is real data. Dashed line beyond "Today" is a trend-line forecast for the next 3 days, fit live from the same points, same idea as the Forecast Lab model.</p>
    <div class="trend-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:240px" id="trendSvg">
        ${gridLines}
        ${forecastZone}
        ${xLabels}
        ${series}
      </svg>
      <div class="trend-tooltip" id="trendTooltip"></div>
    </div>
  `;

  container.querySelectorAll('.trend-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.key;
      if (trendActiveKeys.includes(key)) {
        if (trendActiveKeys.length > 1) trendActiveKeys = trendActiveKeys.filter(k => k !== key);
      } else {
        trendActiveKeys = [...trendActiveKeys, key];
      }
      renderCategoryTrend(container);
    });
  });

  const tooltip = container.querySelector('#trendTooltip');
  container.querySelectorAll('.trend-dot').forEach(dot => {
    dot.addEventListener('mouseenter', (e) => {
      const cx = dot.getAttribute('cx'), cy = dot.getAttribute('cy');
      const svg = container.querySelector('#trendSvg');
      const rect = svg.getBoundingClientRect();
      const scaleX = rect.width / w, scaleY = rect.height / h;
      tooltip.style.left = (cx * scaleX) + 'px';
      tooltip.style.top = (cy * scaleY) + 'px';
      tooltip.innerHTML = `<b>${dot.dataset.cat}</b><br>${dot.dataset.day} · ${dot.dataset.kind} · +${dot.dataset.val}%`;
      tooltip.classList.add('show');
    });
    dot.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });
}

  const confSlider = document.getElementById('confSlider');

  function updatePrediction() {
    const conf = parseInt(confSlider.value, 10);
    const lead = parseInt(leadSlider.value, 10);
    document.getElementById('confLabel').textContent = conf;
    document.getElementById('leadLabel').textContent = lead;
    const pred = predictLift(conf, lead);
    const out = document.getElementById('predOutput');
    out.textContent = `${pred>=0?'+':''}${pred.toFixed(1)}%`;
    out.style.color = pred >= 0 ? 'var(--green)' : 'var(--sindoor)';
    const band = document.getElementById('predBand');
    band.className = `chip ${pred>=15?'ok':pred>=5?'warn':'risk'}`;
    band.innerHTML = `<span class="dot"></span>${pred>=15?'Strong signal':pred>=5?'Moderate signal':'Weak signal'}`;
  }
  confSlider.addEventListener('input', updatePrediction);
  leadSlider.addEventListener('input', updatePrediction);
  updatePrediction();
};

function renderScatterChart(container) {
  const w = 400, h = 320, pad = 36;
  const m = FORECAST_MODEL;
  const all = [...m.rows.map(r=>r.y), ...m.preds];
  const lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
  const scale = v => pad + ((v - lo) / (hi - lo)) * (w - 2*pad);
  const scaleY = v => h - pad - ((v - lo) / (hi - lo)) * (h - 2*pad);

  const diag = `<line x1="${scale(lo)}" y1="${scaleY(lo)}" x2="${scale(hi)}" y2="${scaleY(hi)}" stroke="#d8c8a4" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  const dots = m.rows.map((r,i) => {
    const cx = scale(r.y), cy = scaleY(m.preds[i]);
    return `<circle class="trend-dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4.5" fill="var(--brand)" opacity="0.8"
      data-label="${r.label}" data-actual="${r.y}" data-pred="${m.preds[i].toFixed(1)}" data-city="${r.city}"/>`;
  }).join('');

  container.innerHTML = `
    <div class="trend-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:320px" id="scatterSvg">
        <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#d8c8a4" stroke-width="1"/>
        <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="#d8c8a4" stroke-width="1"/>
        <text x="${w/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="#8f7d5f">Actual % lift</text>
        <text x="10" y="${h/2}" text-anchor="middle" font-size="10" fill="#8f7d5f" transform="rotate(-90 10 ${h/2})">Predicted % lift</text>
        ${diag}
        ${dots}
      </svg>
      <div class="trend-tooltip" id="scatterTooltip"></div>
    </div>
  `;
  const tooltip = container.querySelector('#scatterTooltip');
  container.querySelectorAll('.trend-dot').forEach(dot => {
    dot.addEventListener('mouseenter', () => {
      const svg = container.querySelector('#scatterSvg');
      const rect = svg.getBoundingClientRect();
      const scaleX = rect.width / w, scaleYv = rect.height / h;
      tooltip.style.left = (dot.getAttribute('cx') * scaleX) + 'px';
      tooltip.style.top = (dot.getAttribute('cy') * scaleYv) + 'px';
      tooltip.innerHTML = `<b>${dot.dataset.label}</b><br>${dot.dataset.city} · actual +${dot.dataset.actual}% · predicted ${dot.dataset.pred>=0?'+':''}${dot.dataset.pred}%`;
      tooltip.classList.add('show');
    });
    dot.addEventListener('mouseleave', () => tooltip.classList.remove('show'));
  });
}

/* ---------- Creative Twin video player (canvas-rendered storyboard, interactive) ---------- */
const VIDEO_SCENES = [
  { bg: ['#FF6A3D','#C1272D'], title: 'दिल्ली में 42°C', sub: 'Heatwave alert · Delhi NCR' },
  { bg: ['#E4A11B','#FF6B1A'], title: 'गर्मी हारेगी', sub: 'Rexona 48h protection' },
  { bg: ['#7c3aed','#FF6B1A'], title: 'Beat the heat', sub: 'Trust Rexona' },
  { bg: ['#0F8B3E','#0284c7'], title: 'Rexona जीतेगा', sub: '#BeatTheHeat' },
];
let videoState = { playing: false, t: 0, raf: null, canvas: null, ctx: null };
function renderVideoPlayer(container) {
  cancelAnimationFrame(videoState.raf);
  container.innerHTML = `
    <div class="video-wrap">
      <div class="video-badge">Creative Twin · Preview</div>
      <div class="video-rendering"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span>Guardrail-clear</div>
      <canvas class="video-canvas" id="videoCanvas" width="1280" height="480"></canvas>
      <div class="video-controls">
        <button class="video-play-btn" id="videoPlayBtn" aria-label="Play or pause preview">${icon('i-video','i-sm')}</button>
        <input type="range" class="video-scrub" id="videoScrub" min="0" max="1000" value="0" aria-label="Video scrub position"/>
        <span class="video-time" id="videoTime">0:00 / 0:15</span>
      </div>
    </div>
  `;
  const canvas = document.getElementById('videoCanvas');
  const ctx = canvas.getContext('2d');
  videoState.canvas = canvas; videoState.ctx = ctx;

  function draw(t) {
    const dur = 15000;
    const progress = (t % dur) / dur;
    const sceneCount = VIDEO_SCENES.length;
    const sceneIdx = Math.min(sceneCount - 1, Math.floor(progress * sceneCount));
    const scene = VIDEO_SCENES[sceneIdx];
    const localT = (progress * sceneCount) % 1;

    const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    grad.addColorStop(0, scene.bg[0]);
    grad.addColorStop(1, scene.bg[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // simple ambient particles to sell motion
    ctx.globalAlpha = 0.18;
    for (let i = 0; i < 22; i++) {
      const px = (i * 97 + t / 20) % canvas.width;
      const py = (i * 53 + Math.sin((t / 400) + i) * 40) % canvas.height;
      ctx.beginPath();
      ctx.arc(px, py, 3 + (i % 4), 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const fade = localT < 0.15 ? localT / 0.15 : (localT > 0.85 ? (1 - localT) / 0.15 : 1);
    ctx.globalAlpha = Math.max(0.15, fade);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = '700 46px Inter, sans-serif';
    ctx.fillText(scene.title, canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = '600 20px Inter, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillText(scene.sub, canvas.width / 2, canvas.height / 2 + 34);
    ctx.globalAlpha = 1;

    document.getElementById('videoScrub').value = Math.round(progress * 1000);
    const secs = Math.floor((t % dur) / 1000);
    document.getElementById('videoTime').textContent = `0:${String(secs).padStart(2,'0')} / 0:15`;
  }

  draw(videoState.t);

  function loop(ts) {
    if (!videoState._last) videoState._last = ts;
    const delta = ts - videoState._last;
    videoState._last = ts;
    if (videoState.playing) {
      videoState.t += delta;
      draw(videoState.t);
    }
    videoState.raf = requestAnimationFrame(loop);
  }
  videoState._last = null;
  videoState.raf = requestAnimationFrame(loop);

  document.getElementById('videoPlayBtn').addEventListener('click', () => {
    videoState.playing = !videoState.playing;
    document.getElementById('videoPlayBtn').innerHTML = videoState.playing
      ? `<svg class="i-sm" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>`
      : icon('i-video','i-sm');
  });
  document.getElementById('videoScrub').addEventListener('input', (e) => {
    videoState.t = (e.target.value / 1000) * 15000;
    draw(videoState.t);
  });
}
function regenVideo() {
  toast('Creative Twin re-rendering · new take queued for Guardrail review');
  const idx = Math.floor(Math.random() * VIDEO_SCENES.length);
  VIDEO_SCENES.push(VIDEO_SCENES.splice(idx, 1)[0]);
  videoState.t = 0;
  renderVideoPlayer(document.getElementById('videoPlayer'));
}

      <div class="card">

        <table class="table">
          <thead><tr><th>Activation</th><th>Predicted</th><th>Realized</th><th>Δ vs. forecast</th></tr></thead>
          <tbody>
            ${[
              ['Rexona · Delhi heatwave',     '+22% refill (5d)','+19% (day 3)','−3pt'],
              ['Kissan · IPL Final',          '+24% (2d)',       '+27%',        '+3pt'],
              ['Surf Excel · Mumbai monsoon', '+16% (3d)',       '+14%',        '−2pt'],
              ['Dove · Durga Puja gifting',   '+21% (10d)',      'tracking',    '·'],
            ].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-head"><h3 class="card-title">Feedback into forecasting</h3></div>
        <div class="text-sm" style="line-height:1.8">
          <p>Realized lift is joined back with the fused-forecast confidence at signal time, refining the geo-time weights used to score the next Indian spike.</p>

          <div class="kpi" style="padding:12px"><div class="kpi-label">Loop latency</div><div class="kpi-value" style="font-size:20px">&lt; 4h</div><div class="text-sm text-mute">was weeks</div></div>
          <div class="kpi" style="padding:12px"><div class="kpi-label">Models updated</div><div class="kpi-value" style="font-size:20px">6</div><div class="text-sm text-mute">rolling last 24h</div></div>
        </div>
      </div>
    </div>
  `;
};

/* =====================================================
   MODAL / APPROVAL
   ===================================================== */
let approvedIds = new Set();
let notifReadIds = new Set();
async function loadPersistentState() {
  if (!window.storage) return;
  try {
    const r = await window.storage.get('approved-ids');
    if (r && r.value) JSON.parse(r.value).forEach(id => approvedIds.add(id));
  } catch (e) { /* key not set yet */ }
  try {
    const r2 = await window.storage.get('notif-read-ids');
    if (r2 && r2.value) JSON.parse(r2.value).forEach(id => notifReadIds.add(id));
  } catch (e) { /* key not set yet */ }
}
async function saveApprovedIds() {
  if (!window.storage) return;
  try { await window.storage.set('approved-ids', JSON.stringify([...approvedIds])); } catch (e) {}
}
async function saveNotifReadIds() {
  if (!window.storage) return;
  try { await window.storage.set('notif-read-ids', JSON.stringify([...notifReadIds])); } catch (e) {}
}

function openApprovalModal(id, mode='approve') {
  if (approvedIds.has(id) && mode !== 'edit') {
    toast('Already approved earlier · see the audit trail');
    return;
  }
  const f = FUSED.find(x=>x.id===id);
  const o = OPPORTUNITIES.find(x=>x.id===id);
  document.getElementById('modalTitle').textContent = mode === 'edit' ? 'Edit recommendation' : 'Approve auto-trigger';
  document.getElementById('modalSub').textContent = 'Named HUL approver required · Guardrail-cleared · ASCI compliant';
  const body = document.getElementById('modalBody');
  if (f) {
    body.innerHTML = `
      <div class="grid g-2">
        <div class="field"><label>Fused confidence <span class="text-mute" style="font-weight:400">· how strongly the world signal and real behavior agree</span></label><input value="${f.conf}%" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>Category</label><input value="${f.category}" ${mode==='edit'?'':'disabled'}/></div>
      </div>
      <div class="field"><label>Prediction</label><input value="${f.predicted}" ${mode==='edit'?'':'disabled'}/></div>
      <div class="field"><label>Recommended action</label><textarea rows="2" ${mode==='edit'?'':'disabled'}>${f.action}</textarea></div>
      <div class="field"><label>Approver note (optional)</label><textarea rows="2" placeholder="Log a rationale for the audit trail…"></textarea></div>
      <div class="text-sm text-mute">On approval, Creative Twin drafts variants (Hindi + regional), Guardrail screens them, and Localization &amp; Media agent executes on Meta / YouTube / JioAds / Blinkit.</div>
    `;
  } else if (o) {
    body.innerHTML = `
      <div class="grid g-2">
        <div class="field"><label>Trigger</label><input value="${o.trigger}" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>City</label><input value="${o.city}" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>Brand-fit</label><input value="${o.brandFit}" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>ROI</label><input value="${o.roi}" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>Risk</label><input value="${o.risk}" ${mode==='edit'?'':'disabled'}/></div>
        <div class="field"><label>Lead time <span class="text-mute" style="font-weight:400">· days until predicted shelf impact</span></label><input value="${o.lead}" ${mode==='edit'?'':'disabled'}/></div>
      </div>
      <div class="field"><label>Approver note</label><textarea rows="2" placeholder="Log a rationale for the audit trail…"></textarea></div>
    `;
  } else {
    body.innerHTML = `<div class="field"><label>Note</label><textarea rows="3" placeholder="Approver rationale…"></textarea></div>`;
  }
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-ok" onclick="confirmApproval('${id}')">${icon('i-approve','i-sm')} ${mode==='edit'?'Save & approve':'Approve'}</button>
  `;
  document.getElementById('modal').classList.add('open');
}
function confirmApproval(id) {
  closeModal();
  approvedIds.add(id);
  saveApprovedIds();
  toast(`Approved · logged to GDT audit trail (${id.toUpperCase()})`);
  navigate(currentPage);
}
function openDerivedModal(id) {
  const t = DERIVED.find(x=>x.id===id);
  if (!t) return;
  document.getElementById('modalTitle').textContent = t.trend;
  document.getElementById('modalSub').textContent = `${t.city} · derived from macro signal`;
  document.getElementById('modalBody').innerHTML = `
    <div class="grid g-3">
      <div class="kpi"><div class="kpi-label">Category</div><div class="kpi-value" style="font-size:18px">${t.cat}</div></div>
      <div class="kpi"><div class="kpi-label">Predicted Δ</div><div class="kpi-value" style="color:${t.change>0?'var(--green)':'var(--sindoor)'};font-size:22px">${t.change>0?'+':''}${t.change}%</div></div>
      <div class="kpi"><div class="kpi-label">Confidence</div><div class="kpi-value" style="font-size:22px">${t.conf}%</div></div>
    </div>
    <div class="text-sm mt-md">Lead time <b>${t.lead}</b>. Cross-references live IMD weather, mandi.gov.in prices, news &amp; social APIs and IoT baseline. Feed this into the Opportunity Scorer to auto-draft a business case.</div>
  `;
  document.getElementById('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    <button class="btn btn-primary" onclick="closeModal(); navigate('scorer')">Send to Scorer →</button>
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* =====================================================
   NOTIFICATIONS
   ===================================================== */
function renderNotifs() {
  NOTIFS.forEach(n => { if (notifReadIds.has(n.id)) n.unread = false; });
  const list = document.getElementById('notifList');
  list.innerHTML = NOTIFS.map(n=>{
    const cvar = n.color.startsWith('var(') ? n.color.replace('var(','').replace(')','').trim() : null;
    const cval = cvar ? (getComputedStyle(document.documentElement).getPropertyValue(cvar) || n.color) : n.color;
    return `
      <div class="notif-item ${n.unread?'unread':''}" data-id="${n.id}">
        <div class="notif-icon" style="background:${cval}">${icon(n.icon,'i-sm')}</div>
        <div style="flex:1;min-width:0">
          <div class="notif-title">${n.title}</div>
          <div class="notif-desc">${n.desc}</div>
          <div class="notif-time">${n.time}</div>
        </div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('.notif-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const n = NOTIFS.find(x=>x.id===item.dataset.id);
      if (n) { n.unread = false; notifReadIds.add(n.id); saveNotifReadIds(); }
      renderNotifs();
      document.getElementById('notifPanel').classList.remove('open');
      if (n.id === 'n1' || n.id === 'n4') navigate('trendscape');
      if (n.id === 'n2') navigate('guardrail');
      if (n.id === 'n3') navigate('scorer');
    });
  });
  const unread = NOTIFS.filter(n=>n.unread).length;
  const dot = document.querySelector('#notifBtn .dot');
  if (dot) dot.style.display = unread ? 'block' : 'none';
}
function markAllRead() {
  NOTIFS.forEach(n=>{ n.unread=false; notifReadIds.add(n.id); });
  saveNotifReadIds();
  renderNotifs();
}
document.getElementById('notifBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('notifPanel').classList.toggle('open');
});
document.addEventListener('click', e => {
  const p = document.getElementById('notifPanel');
  if (!p.contains(e.target) && e.target.id !== 'notifBtn' && !document.getElementById('notifBtn').contains(e.target)) {
    p.classList.remove('open');
  }
});

/* =====================================================
   EXPORTS (CSV / SVG download)
   ===================================================== */
function downloadFile(filename, content, mime='text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function toCSV(rows) {
  return rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
}
function exportOppCSV() {
  const rows = [['Title','Trigger','City','Brand-fit','ROI','Risk','Lead','Model lift %']];
  OPPORTUNITIES.forEach(o => {
    const est = estimateOpportunityLift(o);
    rows.push([o.title, o.trigger, o.city, o.brandFit, o.roi, o.risk, o.lead, est.lift.toFixed(1)]);
  });
  downloadFile('opportunities.csv', toCSV(rows), 'text/csv');
  toast('Exported opportunities.csv');
}
function exportIotCSV() {
  const rows = [['Source','City','Change','Unit']];
  IOT.forEach(i => rows.push([i.source, i.city, i.change, i.unit]));
  downloadFile('iot-signals.csv', toCSV(rows), 'text/csv');
  toast('Exported iot-signals.csv');
}
function downloadSvg(svgId, filename) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const src = new XMLSerializer().serializeToString(clone);
  downloadFile(filename, src, 'image/svg+xml');
  toast(`Exported ${filename}`);
}

/* =====================================================
   TOAST
   ===================================================== */
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#14213D;color:white;padding:12px 20px;border-radius:10px;
    font-size:13px;font-weight:600;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    opacity:0;transition:opacity .2s, transform .2s;
    border-left:3px solid var(--brand);
  `;
  document.body.appendChild(t);
  requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(-4px)'; });
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2200);
}

/* =====================================================
   GLOBAL SEARCH
   ===================================================== */
function runGlobalSearch(q) {
  const query = q.trim().toLowerCase();
  const panel = document.getElementById('searchResults');
  if (!query) { panel.classList.remove('open'); panel.innerHTML = ''; return; }

  const groups = [];

  const trendHits = DERIVED.filter(t => (t.trend+t.cat+t.city).toLowerCase().includes(query)).slice(0,4);
  if (trendHits.length) groups.push({ label:'Trends', icon:'i-flame', items: trendHits.map(t => ({
    title: t.trend, meta: `${t.cat} · ${t.city}`, page: 'trendscape'
  })) });

  const oppHits = OPPORTUNITIES.filter(o => (o.title+o.trigger+o.city).toLowerCase().includes(query)).slice(0,4);
  if (oppHits.length) groups.push({ label:'Opportunities', icon:'i-target', items: oppHits.map(o => ({
    title: o.title, meta: `${o.city} · ${o.roi} ROI`, page: 'scorer'
  })) });

  const festHits = FESTIVALS.filter(f => (f.name+f.cats).toLowerCase().includes(query)).slice(0,4);
  if (festHits.length) groups.push({ label:'Festivals', icon:'i-diya', items: festHits.map(f => ({
    title: f.name, meta: `${f.date} · ${f.cats}`, page: 'home'
  })) });

  const sigHits = MAP_DOTS.filter(d => (d.label+d.city+d.state).toLowerCase().includes(query)).slice(0,4);
  if (sigHits.length) groups.push({ label:'Live signals', icon:'i-signal', items: sigHits.map(d => ({
    title: d.label, meta: `${d.city}, ${d.state}`, page: 'trendscape'
  })) });

  const prodHits = PORTFOLIO.filter(p => (p.name+p.desc).toLowerCase().includes(query)).slice(0,3);
  if (prodHits.length) groups.push({ label:'AI Products', icon:'i-grid', items: prodHits.map(p => ({
    title: p.name, meta: p.stage, page: p.key
  })) });

  if (!groups.length) {
    panel.innerHTML = `<div class="search-empty">No matches for "${q}"</div>`;
  } else {
    panel.innerHTML = groups.map(g => `
      <div class="search-result-group">
        <div class="search-result-label">${g.label}</div>
        ${g.items.map(it => `
          <div class="search-result-item" data-page="${it.page}">
            <div class="sig-icon" style="width:26px;height:26px;background:var(--brand)">${icon(g.icon,'i-sm')}</div>
            <div>
              <div class="search-result-title">${it.title}</div>
              <div class="search-result-meta">${it.meta}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');
  }
  panel.classList.add('open');
  panel.querySelectorAll('.search-result-item').forEach(el => {
    el.addEventListener('click', () => {
      navigate(el.dataset.page);
      document.getElementById('topSearchInput').value = '';
      panel.classList.remove('open');
    });
  });
}
const searchInput = document.getElementById('topSearchInput');
searchInput.addEventListener('input', (e) => runGlobalSearch(e.target.value));
searchInput.addEventListener('focus', (e) => { if (e.target.value.trim()) runGlobalSearch(e.target.value); });
document.addEventListener('click', (e) => {
  const panel = document.getElementById('searchResults');
  if (!panel.contains(e.target) && e.target !== searchInput) panel.classList.remove('open');
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { searchInput.value=''; document.getElementById('searchResults').classList.remove('open'); searchInput.blur(); }
});

document.getElementById('menuBtn').addEventListener('click', () => {

/* =====================================================
   LIVE HEARTBEAT (keeps a couple of surfaces feeling like
   a streaming system without needing a real backend)
   ===================================================== */
function startLiveHeartbeat() {
  const IOT_SAMPLES = [
    ['Dispenser refill',   'Rexona AP · 110001 Delhi'],
    ['Shelf restock',      'Surf Excel liquid · 400001 Mumbai'],
    ['Handwash pump',      'Lifebuoy · 110020 Delhi'],
    ['Q-com POS',          'Kissan sq. · 400020 Mumbai'],
    ['Haircare dispenser', 'Sunsilk · 110070 Delhi'],
    ['Freezer door-opens', "Kwality Wall's · 110016 Delhi"],
  ];
  setInterval(() => {
    // Nudge the home page KPI strip so it feels like a live counter, not a screenshot.
    if (currentPage === 'home') {
      const kpiEls = document.querySelectorAll('#kpiGrid .kpi-value');
      if (kpiEls[0] && Math.random() < 0.6) {
        const cur = parseInt(kpiEls[0].textContent, 10);
        if (!isNaN(cur)) kpiEls[0].textContent = cur + (Math.random() < 0.7 ? 1 : 0);
      }
    }
    // Stream a new row into the IoT sensor table when that tab is open.
    if (currentPage === 'trendscape' && currentTsTab === 'iot') {
      const tbody = document.getElementById('iotStream');
      if (tbody) {
        const [source, sku] = IOT_SAMPLES[Math.floor(Math.random()*IOT_SAMPLES.length)];
        const pct = Math.floor(Math.random()*22)+6;
        const ts = new Date().toTimeString().slice(0,8);
        const row = document.createElement('tr');
        row.innerHTML = `<td class="text-mute">${ts}</td><td><b>${source}</b></td><td>${sku}</td><td style="color:var(--green);font-weight:700">+${pct}% WoW</td><td class="text-mute">live</td>`;
        tbody.prepend(row);
        while (tbody.children.length > 8) tbody.removeChild(tbody.lastChild);
      }
    }
  }, 4000);
}

   INIT
   ===================================================== */
document.querySelectorAll('.nav-item[data-page]').forEach(el => {
  el.addEventListener('click', () => navigate(el.dataset.page));
});
(async function initApp() {
  await loadPersistentState();
  renderNotifs();
  navigate('home');
  startLiveHeartbeat();
})();
</script>
